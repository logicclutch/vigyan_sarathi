# Vigyan Sarathi static site (single-page app) behind Traefik
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml;

  # Correct types for self-hosted fonts and the web manifest
  types {
    font/woff2 woff2;
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # Hashed build assets never change
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fonts, logo files, icons, placeholders: cache for a month
  location ~* \.(woff2|svg|png|ico|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SEO files always revalidate
  location ~* \.(xml|txt)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Everything else: the app shell handles client-side routes
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
