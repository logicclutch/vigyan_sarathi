# Vigyan Sarathi static site (single-page app) behind Traefik, with the admin API proxied.
server {
  listen 80;
  server_name _;
  root __ROOT__;
  index index.html;
  client_max_body_size 12m;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml;

  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # Admin API
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }

  # Images uploaded through the admin panel
  location /uploads/ {
    alias /srv/data/uploads/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed build assets never change
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fonts, logo files, icons, placeholders: cache for a month
  location ~* \.(woff2|svg|png|ico|webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # SEO files always revalidate
  location ~* \.(xml|txt)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Admin panel: app shell, never indexed
  location /admin {
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  # Everything else: the app shell handles client-side routes
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
