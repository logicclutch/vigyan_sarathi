# Vigyan Sarathi behind an existing Traefik reverse proxy, with the admin API/publisher.
# Copy .env.example to .env, set SITE_DOMAIN, the Traefik names, ADMIN_EMAIL, ADMIN_PASSWORD and
# SESSION_SECRET, then: docker compose up -d --build
services:
  web:
    build:
      context: .
      args:
        VITE_SITE_URL: https://${SITE_DOMAIN}
    image: vigyan-sarathi:latest
    container_name: vigyan-sarathi
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - releases:/srv/releases:ro
      - data:/srv/data:ro
    networks:
      - traefik
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      # HTTPS router
      - traefik.http.routers.vigyan.rule=Host(`${SITE_DOMAIN}`) || Host(`www.${SITE_DOMAIN}`)
      - traefik.http.routers.vigyan.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.vigyan.tls=true
      - traefik.http.routers.vigyan.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.vigyan.middlewares=vigyan-www
      - traefik.http.services.vigyan.loadbalancer.server.port=80
      # www → apex redirect
      - traefik.http.middlewares.vigyan-www.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.vigyan-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.vigyan-www.redirectregex.permanent=true
      # HTTP → HTTPS (harmless if Traefik already redirects globally)
      - traefik.http.routers.vigyan-http.rule=Host(`${SITE_DOMAIN}`) || Host(`www.${SITE_DOMAIN}`)
      - traefik.http.routers.vigyan-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}
      - traefik.http.routers.vigyan-http.middlewares=vigyan-https
      - traefik.http.middlewares.vigyan-https.redirectscheme.scheme=https
      - traefik.http.middlewares.vigyan-https.redirectscheme.permanent=true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: vigyan-sarathi-api:latest
    container_name: vigyan-sarathi-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTO_PUBLISH_ON_START: "true"
    volumes:
      - releases:/srv/releases
      - data:/srv/data
    networks:
      - internal

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
  internal: {}

volumes:
  releases: {}
  data: {}
